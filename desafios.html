<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Conquistas</title>

<link rel="stylesheet" href="css\conquista.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>
<body>

<div class="container">

<header>

<button class="voltar" onclick="history.back()">
<i class="fa-solid fa-arrow-left"></i>
</button>

<h2>Conquistas</h2>

</header>

<section class="nivel">

<h3>Nível 8</h3>

<div class="barra">

<div class="xp"></div>

</div>

<p>780 / 1000 XP</p>

</section>

<section class="cards">

<div class="card desbloqueada">

<i class="fa-solid fa-shoe-prints"></i>

<h4>Primeiros Passos</h4>

<p>1.000 passos</p>

</div>

<div class="card desbloqueada">

<i class="fa-solid fa-fire"></i>

<h4>Sequência</h4>

<p>7 dias seguidos</p>

</div>

<div class="card desbloqueada">

<i class="fa-solid fa-medal"></i>

<h4>Explorador</h4>

<p>50 km percorridos</p>

</div>

<div class="card bloqueada">

<i class="fa-solid fa-lock"></i>

<h4>Maratonista</h4>

<p>100 km percorridos</p>

</div>

<div class="card bloqueada">

<i class="fa-solid fa-lock"></i>

<h4>Mestre dos Passos</h4>

<p>500.000 passos</p>

</div>

<div class="card bloqueada">

<i class="fa-solid fa-lock"></i>

<h4>365 Dias</h4>

<p>Use o app durante um ano.</p>

</div>

</section>

</div>

<script src="js\conquistas.js"></script>

</body>
</html>
