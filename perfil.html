<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passo+ | Perfil</title>
    <link rel="stylesheet" href="perfil.css">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="perfil">

    <div class="topo">
        <h2>Meu Perfil</h2>
    </div>

    <div class="foto">
        <img src="imagem\profile-picture.jpeg" alt="">
        <button>
            <i class="fa-solid fa-camera"></i>
        </button>
    </div>

    <div class="nome">
        <h3>Richardy Oliveira</h3>
        <p>Meta diária: 10.000 passos</p>
    </div>

    <div class="estatisticas">

        <div class="card">
            <h3>125.420</h3>
            <span>Passos</span>
        </div>

        <div class="card">
            <h3>92 km</h3>
            <span>Percorridos</span>
        </div>

        <div class="card">
            <h3>8.954</h3>
            <span>Calorias</span>
        </div>

    </div>

    <div class="opcoes">

        <div class="item">
            <i class="fa-solid fa-user"></i>
            <span>Editar Perfil</span>
            <i class="fa-solid fa-chevron-right"></i>
        </div>

        <div class="item">
            <i class="fa-solid fa-bullseye"></i>
            <span>Alterar Meta</span>
            <i class="fa-solid fa-chevron-right"></i>
        </div>

        <div class="item">
            <i class="fa-solid fa-chart-line"></i>
            <span>Histórico</span>
            <i class="fa-solid fa-chevron-right"></i>
        </div>

        <div class="item">
            <i class="fa-solid fa-trophy"></i>
            <span>Conquistas</span>
            <i class="fa-solid fa-chevron-right"></i>
        </div>

        <div class="item">
            <i class="fa-solid fa-gear"></i>
            <span>Configurações</span>
            <i class="fa-solid fa-chevron-right"></i>
        </div>

    </div>

    <button class="sair">
        Sair da Conta
    </button>

</div>

<script src="prerfil.js"></script>

</body>
</html>
