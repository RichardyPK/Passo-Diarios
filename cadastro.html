<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadastro - Passo+</title>

<link rel="stylesheet" href="cadastro.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>
<body>

<div class="container">

<div class="logo">

<i class="fa-solid fa-shoe-prints"></i>

<h1>Passo+</h1>

<p>Crie sua conta</p>

</div>

<form id="cadastroForm">

<div class="campo">
<i class="fa-solid fa-user"></i>
<input
type="text"
placeholder="Nome completo"
required>
</div>

<div class="campo">
<i class="fa-solid fa-envelope"></i>
<input
type="email"
placeholder="E-mail"
required>
</div>

<div class="campo">
<i class="fa-solid fa-phone"></i>
<input
type="tel"
placeholder="Telefone"
required>
</div>

<div class="campo">
<i class="fa-solid fa-lock"></i>
<input
type="password"
id="senha"
placeholder="Senha"
required>
</div>

<div class="campo">
<i class="fa-solid fa-lock"></i>
<input
type="password"
id="confirmar"
placeholder="Confirmar senha"
required>
</div>

<button type="submit">
Criar Conta
</button>

</form>

<p class="login">

Já possui conta?

<a href="login.html">
Entrar
</a>

</p>

</div>

<script src="cadastro.js"></script>

</body>
</html>
